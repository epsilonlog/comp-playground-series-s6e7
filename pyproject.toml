[project]
name = "s6e7"
version = "0.1.0"
description = "Kaggle Playground Series S6E7 — predicting student health risk"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "catboost>=1.2.10",
    "kaggle>=2.2.4",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "optuna>=4.9.0",
    "polars>=1.44.1",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.0",
    "torch>=2.13.0",
    "xgboost>=3.4.1",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

# CPU-only torch. `explicit = true` keeps this index scoped to torch alone —
# without it uv resolves generic deps (certifi, requests, urllib3, ...) from
# the PyTorch mirror and silently downgrades them.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Ruff 0.16 formats fenced Python in Markdown; keep it off the docs.
extend-exclude = ["*.md", "notebooks"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib  (CLAUDE.md: pathlib never os.path)
    "NPY",  # numpy-specific rules
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true
warn_return_any = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true

# Third-party packages shipping no type information.
[[tool.mypy.overrides]]
module = [
    "catboost.*",
    "catstat.*",
    "lightgbm.*",
    "masamlp.*",
    "optuna.*",
    "pandas.*",
    "sklearn.*",
    "xgboost.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
